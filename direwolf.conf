# ADEVICE takes <capture>,<playback> — using the same named
# device for both here since RX and TX go through the same
# IC-705 USB audio interface.
#
# Confirmed by user:
# ADEVICE plughw:IC705
#
# Although it might be something like:
# card 1: CODEC [USB Audio CODEC], device 0: USB Audio [USB Audio]
# ==============================================================================
# AUDIO CONFIGURATION
# ==============================================================================
# Verify host ALSA device GID and device nodes:
#   docker compose run --rm --entrypoint ls direwolf-hamlib -la /dev/snd
#
# Compose Requirements:
#   - devices: "/dev/snd:/dev/snd"
#   - group_add: Include host audio GID (find via `getent group audio | cut -d: -f3`)
#
# direwolf.conf Setting:
#   ADEVICE plughw:0,6 plughw:0,0  # <capture: pcmC0D6c>, <playback: pcmC0D0p>
# ==============================================================================


# ADEVICE <input_output_device>
# cat /proc/asound/cards (use name in first []) or aplay -l and arecord -l (use word after ':' but before '[')
ADEVICE null plughw:CARD=CD002,DEV=0
# ADEVICE plughw:IC705,IC705
# ADEVICE pipewire
# ADEVICE null
# ADEVICE plughw:0,6
# ADEVICE null plughw:2,0
# ADEVICE null plughw:CARD=Au,DEV=0

# How many audio channels to use
ACHANNELS 1

# Audio bitrate (default is 44100 Hz)
ARATE 48000

# Baud rate (default is 1200 baud)
MODEM 1200

# PTT RIG <Hamlib rig number> <device address>
# To find rig number run: 'rigctl -l | grep -i <radio name/id>'
PTT RIG 1 127.0.0.1:4532
#PTT RIG 3085 /dev/ttyACM0

# Add an optional delay for use with VOX
# TXDELAY 30

# Enables KISS protocol on the specified port
KISSPORT 8001
# Disables the AGW port
AGWPORT 0

# FX.25 transmit: adds FEC to outgoing AX.25 frames
FX25TX 1
