# ADEVICE <input_output_device>
# Found using 'aplay -l' and 'arecord -l'
ADEVICE plughw:1,0

# How many audio channels to use
ACHANNELS 1

# Baud rate (default is 1200 baud)
MODEM 1200

# PTT control - Direwolf asserts PTT before transmitting and releases it after.
# Choose the method that matches your hardware setup:
#
#   PTT RIG 4532 127.0.0.1   # Use Hamlib rigctld (must be running on port 4532)
#   PTT SERIAL /dev/ttyUSB0 RTS   # Serial port RTS pin
#   PTT GPIO 25              # Raspberry Pi GPIO pin
#   PTT CM108                # CM108/CM119 USB audio dongle GPIO
#
PTT RIG 4532 127.0.0.1

# Enables KISS protocol on the specified port
KISSPORT 8001

# FX.25 transmit: adds FEC to outgoing AX.25 frames
FX25TX 1
