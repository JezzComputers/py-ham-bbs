# ADEVICE <input_output_device>
# Found using 'aplay -l' and 'arecord -l'

# ---------------------------------------------------------------
# TODO: Confirm ADEVICE name before relying on this.
# Run `aplay -l` (and `arecord -l` for capture) with the IC-705
# plugged in and powered on, then look for a line like:
#   card 1: IC705 [IC-705], device 0: USB Audio [USB Audio]
# Use the ID in the FIRST bracket after "card N:" (e.g. IC705).
#
# ADEVICE takes <capture>,<playback> — using the same named
# device for both here since RX and TX go through the same
# IC-705 USB audio interface.
#
# Confirmed by user:
# ADEVICE plughw:IC705,IC705
#
# Although it might be something like:
# card 1: CODEC [USB Audio CODEC], device 0: USB Audio [USB Audio]
# ---------------------------------------------------------------
# ADEVICE plughw:IC705,IC705
# ADEVICE plughw:1,0
# ADEVICE pipewire
ADEVICE null

# How many audio channels to use
ACHANNELS 1

# Baud rate (default is 1200 baud)
MODEM 1200

# PTT RIG <Hamlib rig number> <device address>
# To find rig number run: 'rigctl -l | grep -i <radio name/id>'
PTT RIG 1 127.0.0.1:4532
#PTT RIG 3085 /dev/ttyACM0

# Add an optional delay for use with VOX
# TXDELAY 30

# Enables KISS protocol on the specified port
KISSPORT 8001
# Disables the AGW port
AGWPORT 0

# FX.25 transmit: adds FEC to outgoing AX.25 frames
FX25TX 1
