# Run tests with: uv run pytest && uv run pyright && uv run ruff check && uv run ruff format --diff

# Project configuration
[project]
name = "py-ham-bbs"
version = "0.1.0"
description = "Python based BBS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["websockets"]

# Install with uv sync --upgrade --all-groups
[dependency-groups]
dev = [
	"pyright",
	"pytest",
	"ruff",
	"snakeviz",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "-v"]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["always"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 320

[tool.ruff.lint]
select = ["ALL"]
ignore = [
	"D",      # All docstring rules
	"T20",    # print() rules
	"TC003",  # All std imports without typecheck
	"FBT",    # boolean trap rules
	"PLR",    # magic values, too many returns, etc.
	"TRY",    # exception message rules
	"EM",     # exception literal rules
	"B028",   # warnings stacklevel
	"I001",   # Import block formating
	"INP",    # implicit namespace package
	"S101",   # assert in tests
	"C90",    # complexity rules
	"W191",   # Allow tabs for indentation
	"ERA",    # Allow commented-out code
	"E501",   # Allow long lines
	"COM812", # avoid formatter conflict warnings
	"TD002",  # Author in TODO
	"TD003",  # Issue link in TODO
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
line-ending = "lf"

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = true
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportPrivateUsage = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportUntypedFunctionDecorator = "error"

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = [
  "src",
  ".",
  ".venv/lib/python3.14/site-packages"
]
